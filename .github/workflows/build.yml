name: Build Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build
      run: dotnet build -c Release

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: SpinalForm-DLL
        path: bin/Release/net9.0/*.dll
